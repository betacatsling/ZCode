version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints: [packages/services/src/session/contract.ts]
    owner: conversation
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  - id: project-catalog
    roots: [packages/services/src/project-catalog]
    managed: true
    requires: [shared]
    publicEntrypoints:
      [
        packages/services/src/project-catalog/contract.ts,
        packages/services/src/project-catalog/index.ts,
      ]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: project-catalog
  - id: worktree
    roots: [packages/services/src/worktree]
    managed: true
    requires: [shared]
    publicEntrypoints:
      [
        packages/services/src/worktree/contract.ts,
        packages/services/src/worktree/removalContract.ts,
        packages/services/src/worktree/index.ts,
      ]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: target-worktree
  - id: session-hierarchy
    roots: [packages/services/src/session-hierarchy]
    managed: true
    requires: [shared]
    publicEntrypoints:
      [
        packages/services/src/session-hierarchy/contract.ts,
        packages/services/src/session-hierarchy/index.ts,
      ]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: session-migration
  - id: model-gateway
    roots: [packages/services/src/model-gateway]
    managed: true
    requires: [zcode-cli]
    publicEntrypoints:
      [
        packages/services/src/model-gateway/contract.ts,
        packages/services/src/model-gateway/index.ts,
        packages/services/src/model-gateway/targetModelGateway.ts,
      ]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: target-model-gateway
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: zcode-server-cli
    roots: [packages/zcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  - id: desktop
    roots: [packages/desktop/src]
    managed: false
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: zcode-cli
    roots: [apps/zcode-cli]
    managed: false

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

exceptions: []
